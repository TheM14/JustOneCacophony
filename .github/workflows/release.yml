name: release

# A tag is the release trigger: pushing v<version> builds every platform, checks
# that the tag matches include/joc_version.h and publishes the packaged archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the declared version
        shell: bash
        run: |
          declared=$(sed -n 's/.*JOC_VERSION_STRING *"\([^"]*\)".*/\1/p' include/joc_version.h)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$declared" ] || [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match the declared version (${declared:-unset})" >&2
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      # The CLI and its runtime assets sit at the archive root with the libraries
      # in lib/ below, so the download can be unpacked and run as it is.
      - name: Stage
        run: cmake --install build --config Release --prefix stage

      - name: Package
        shell: bash
        run: |
          folder="joc_cli_${{ matrix.label }}"
          mkdir -p "package/$folder/lib"
          cp -r stage/bin/. "package/$folder/"
          cp -r stage/lib/. "package/$folder/lib/"

      - name: Archive
        run: cmake -E tar cf "joc_cli_${{ matrix.label }}.zip" --format=zip "package/joc_cli_${{ matrix.label }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: joc_cli_*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The archives are attached to the tag's release, whether that release was
      # created here or beforehand in the web interface.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber dist/*.zip
